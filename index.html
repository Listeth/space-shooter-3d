<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 太空射击</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js"
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="hud">
        <div class="label">SCORE</div>
        <div class="value" id="scoreVal">0</div>
        <div class="label" style="margin-top:6px;">WAVE</div>
        <div class="value" id="waveVal">1</div>
        <div class="label" style="margin-top:6px;">HP</div>
        <div id="healthWrap"><div id="healthBar"></div></div>
    </div>

    <button id="fireBtn">MEGA</button>

    <div id="gameOverScreen">
        <h2>GAME OVER</h2>
        <p id="finalScore">得分: 0</p>
        <p id="finalWave">波次: 1</p>
        <button id="restartBtn">重新开始</button>
    </div>

    <div id="touchHint">← 拖动屏幕移动 →</div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
